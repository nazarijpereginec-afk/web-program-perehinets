<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №4</title>
</head>

<body>
    <h1>Лабораторна робота №4</h1>
    <h2>Робота з об'єктами та масивами в JavaScript</h2>

    <h2>Завдання 1</h2>
    <button onclick="showBook()">
        Виконати завдання 1
    </button>

    <h2>Завдання 2</h2>
    <button onclick="showLibrary()">
        Показати бібліотеку
    </button>

    <button onclick="addExampleBook()">
        Додати книгу
    </button>

    <h2>Завдання 3</h2>
    <button onclick="sortBooks()">
        Сортувати за роком
    </button>

    <button onclick="showUnreadBooks()">
        Показати непрочитані
    </button>

    <button onclick="findTolkienBook()">
        Знайти книгу Толкіна
    </button>

    <h2>Завдання 4</h2>
    <button onclick="addBook()">
        Додати книгу через prompt
    </button>

    <h2>Індивідуальне завдання 1</h2>
    <button onclick="markBookAsRead()">
        Позначити книгу прочитаною
    </button>

    <h2>Індивідуальне завдання 2</h2>
    <button onclick="showAverageYear()">
        Обчислити середній рік
    </button>

    <div id="result"></div>

    <script src="main.js"></script>
</body>
</html>
