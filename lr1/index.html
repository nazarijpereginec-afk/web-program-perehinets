<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Лабораторна робота №1</title>
</head>

<body>

    <h1>Лабораторна робота №1</h1>
    <h2>Завдання 1</h2>
    <button onclick="checkNumber()">Виконати завдання 1</button>
    <p id="numberResult"></p>
    <h2>Завдання 2</h2>
    <button onclick="createPassword()">Виконати завдання 2</button>
    <div id="password"></div>
    <h2>Завдання 3</h2>
    <button onclick="calculateAverage()">Виконати завдання 3</button>
    <div id="average"></div>
    <h2>Завдання 4</h2>
    <button onclick="getStudents()">Виконати завдання 4</button>
    <div id="students"></div>


    <script>
        // Завдання 1
        function checkNumber() {
            let number = 11;
            let result = document.getElementById("numberResult");
            if (number % 2 === 0) {
                result.textContent = "Число " + number + " є парним";
                result.style.color = "green";
            } else {
                result.textContent = "Число " + number + " є непарним";
                result.style.color = "red";
            }
        }

        // Завдання 2
        function createPassword() {
            let name = "Назар";
            let number = 11;
            let password = name.substring(0, 3) + number * 2;
            document.getElementById("password").textContent =
                "Ваш пароль: " + password;
        }

        // Завдання 3
        function calculateAverage() {
            let grade1 = Number(prompt("Введіть першу оцінку:"));
            let grade2 = Number(prompt("Введіть другу оцінку:"));
            let grade3 = Number(prompt("Введіть третю оцінку:"));
            let average = (grade1 + grade2 + grade3) / 3;
            document.getElementById("average").textContent =
                "Середня оцінка: " + average.toFixed(2);
        }

        // Завдання 4
        function getStudents() {
            let count = Number(prompt("Введіть кількість студентів:"));
            let studentsBlock = document.getElementById("students");
            studentsBlock.innerHTML = "";
            for (let i = 1; i <= count; i++) {
                let surname = prompt(
                    "Введіть прізвище студента №" + i
                );
                let name = prompt(
                    "Введіть ім'я студента №" + i
                );
                let student = document.createElement("p");
                student.textContent =
                    i + ". " + surname + " " + name;

                studentsBlock.appendChild(student);
            }
        }

    </script>
</body>
</html>
